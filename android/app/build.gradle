apply plugin: 'com.android.application'

/* La version sale de la web (app/state-core.jsx, la que cambia `npm run bump`):
   asi no hay un octavo sitio que olvidar. versionCode tiene que crecer en cada
   subida a Google Play: 0.137.0 da 137000 y 1.0.0 da 1000000. */
def paceVersion = (file('../../app/state-core.jsx').text =~ /PACE_VERSION = 'v(\d+)\.(\d+)\.(\d+)'/)[0]

android {
    namespace = "com.ezradesign.pace"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ezradesign.pace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode paceVersion[1].toInteger() * 1000000 + paceVersion[2].toInteger() * 1000 + paceVersion[3].toInteger()
        versionName "${paceVersion[1]}.${paceVersion[2]}.${paceVersion[3]}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* Clave de depuracion FIJA y en el repo. No es secreta: solo firma los APK
       de prueba. Sin ella GitHub crea una nueva en cada compilacion, y un APK no
       se instala encima de otro firmado con otra clave: habia que desinstalar,
       y eso borra los datos. La clave de Google Play es otra y no vive aqui. */
    signingConfigs {
        debug {
            storeFile file('pace-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        /* La llave de subida a Google Play. Nunca vive en el repo: el workflow
           Android la saca de los secretos de GitHub a un archivo temporal y
           pasa aqui su ruta y su contraseña. Sin ellas no hay version firmada
           y la compilacion de prueba sigue igual. Google firma luego la app
           con su propia llave (Play App Signing). */
        if (System.getenv('PACE_UPLOAD_KEYSTORE')) {
            release {
                storeFile file(System.getenv('PACE_UPLOAD_KEYSTORE'))
                storePassword System.getenv('PACE_UPLOAD_PASSWORD')
                keyAlias 'pace-upload'
                keyPassword System.getenv('PACE_UPLOAD_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PACE_UPLOAD_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
