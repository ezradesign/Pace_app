# RAMA DE DIAGNÓSTICO (no se junta): mide en Linux el título de la pregunta del día y sus dos enlaces
# («Ahora no» y «Hoy voy por libre») frente al hueco de la fila (tests/diag-ahora-no.spec.js).
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mide:
    name: mide «Ahora no» en Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache de Chromium y WebKit
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Medir
        run: npx playwright test tests/diag-ahora-no.spec.js --project=chromium --reporter=list
