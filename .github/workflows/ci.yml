# RAMA DE DIAGNÓSTICO (no se junta): mide en Linux la home del ordenador con el navegador ampliado.
name: CI
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Las pruebas de la home y del aro
        run: npx playwright test tests/home- tests/aro- tests/lienzo tests/sello-aro tests/runner-aro --project=chromium --workers=2 --reporter=line 2>&1 | tail -40 | tee pruebas-linux.txt
      - name: El banco, del 100 al 200 %
        run: node scripts/audit/banco-zoom-home.js _zoom-linux --hilos=3
      - name: Las maquetas, en las ventanas bajas
        run: |
          for m in a-dia-en-una-fila b-aro-al-lado; do
            node scripts/audit/banco-zoom-home.js _zoom-linux-$m --hilos=3 --zoom=125,150,175 --momento=corta,servido,llegando,terminado --css=docs/proposals/zoom-home-21nov/$m.css
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zoom-linux
          path: |
            pruebas-linux.txt
            _zoom-linux*/
