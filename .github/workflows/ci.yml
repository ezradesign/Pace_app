# RAMA DE DIAGNÓSTICO (no se junta): mide en Linux las filas que en Windows caben y en la CI no.
name: CI
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Medidas
        run: npx playwright test tests/zz-diag-otros.spec.js tests/zz-diag-cambios.spec.js --project=chromium --workers=2 --reporter=line 2>&1 | grep '^DIAG' | sort | tee diag-linux.txt
      - name: Teclado, tres veces
        run: npx playwright test tests/pausa-teclado.spec.js --project=chromium --repeat-each=3 --reporter=line || true
      - uses: actions/upload-artifact@v4
        with:
          name: diag-linux
          path: diag-linux.txt
