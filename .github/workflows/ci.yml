# RAMA DE DIAGNÓSTICO (no se junta): la auditoría a fondo del 24 nov. en Linux (= Android), y cuánto le sobra
# a cada alternativa de la F4 (tests/diag-f4.spec.js).
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mide:
    name: mide la auditoría a fondo en Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache de Chromium y WebKit
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Medir
        run: npx playwright test tests/diag-f4.spec.js tests/fondo-24nov.spec.js tests/textos-al-limite.spec.js tests/ritmo-series.spec.js tests/pausa-sin-repetir.spec.js tests/checklist-foco.spec.js tests/contraste-rotulos.spec.js tests/pulido-23nov.spec.js tests/ritmo-pregunta-movil.spec.js tests/home-sin-scroll.spec.js tests/ver-ejercicio.spec.js tests/toques-movil.spec.js --project=chromium --reporter=list
