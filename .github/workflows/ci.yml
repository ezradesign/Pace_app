# PACE · integracion continua
#
# La red de seguridad LOCAL vive en `npm run verify` (s150 la creo, s152 la
# completo; s169 le sumo la del encargo de arte). Este workflow no la duplica ni la
# reinterpreta: la INVOCA. Si algo hay que vigilar, se anade al verify y aqui
# no se toca nada — de ese modo lo que falla en CI se reproduce en local con
# un solo comando, que es la unica forma de que un CI no se vuelva un oraculo.
#
# Lo unico que este archivo anade por su cuenta es lo que el verify NO PUEDE
# comprobar por diseno: que el `index.html` committeado sea el build de las
# fuentes. El verify corre justo ANTES de regenerarlo en el cierre de sesion,
# o sea en el momento en que el artefacto TIENE que estar desactualizado, asi
# que su aviso de deriva es `[INFO]` a proposito y jamas se pondra rojo.
# Esperar que lo haga no funciona: hay que comprobarlo aparte, y aqui es donde.
#
# DOS JOBS (s154):
#   verify -> `npm run verify` + frescura del artefacto.
#   e2e    -> `npm run test:e2e`, el checklist de cierre EJECUTADO en un
#             navegador de verdad. Cubre el primer hueco que el verify declara
#             («no abre navegador, no monta la app, no pulsa nada»).
# Los dos siguen la misma regla: INVOCAN un comando que corre igual en local.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: este workflow no publica nada ni escribe en el repo.
permissions:
  contents: read

# Un push encima de otro cancela el anterior: interesa el ultimo estado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 24 = el del desarrollo local (v24.15.0). `package.json` no declara
      # `engines`, asi que la version vive aqui: si algun dia se anade ese campo,
      # este numero se alinea con el.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` y no `npm install`: instala EXACTAMENTE el lockfile y falla si
      # se ha desincronizado de package.json, en vez de arreglarlo por su cuenta.
      # (`sharp` es nativa y no la usan ni el build ni el verify —solo la ingesta
      # de arte y los scripts de audit—, pero el lock v3 trae su binario de
      # linux-x64, asi que se instala sin incidencias.)
      - name: Instalar dependencias
        run: npm ci

      # LA red de seguridad. Devuelve codigo de salida: si falla, no se sigue.
      # 4 tandas — node --check de todos los .js (tambien sw.js y scripts/, que
      # el build no mira jamas) · build con salida 0 · analisis de AMBITO del
      # artefacto compilado (el crash de s144) · integridad de i18n, precache,
      # glifos y catalogos. Restaura los dos artefactos en su `finally`.
      - name: npm run verify
        run: npm run verify

      # Frescura del artefacto. Va DESPUES del verify a proposito: el verify
      # corre el build de verdad y reescribe los dos artefactos antes de
      # restaurarlos, asi que comparar mientras corre no mide nada.
      #
      # DOS COSAS QUE NO SE PUEDEN "SIMPLIFICAR" AQUI:
      #
      #  1. El diff va ACOTADO a index.html. Un `git diff --exit-code` a secas
      #     se pondria rojo SIEMPRE por `PACE_standalone.html`, que esta
      #     congelado en v0.71.0 a proposito (s134: export bajo demanda, ya no
      #     se regenera en cada cierre) y que el build acaba de reescribir a la
      #     version actual. En el runner da igual —es efimero y no se committea
      #     nada—, pero el diff tiene que ignorarlo.
      #
      #  2. Esta comprobacion solo tiene sentido si el artefacto es REPRODUCIBLE
      #     entre plataformas, y al principio NO lo era: el primer run de este
      #     workflow se puso rojo aqui. La causa no era el YAML sino el build —
      #     `.gitattributes` guarda el texto en LF, pero en un worktree de
      #     Windows varios fuentes acaban en CRLF y `readFileClean` los inlineaba
      #     tal cual, y con CRLF **Babel emite otra indentacion** en los
      #     comentarios que conserva: **una linea de diferencia, un espacio**,
      #     invisible en local y roja en el runner. Arreglado en el build (s153),
      #     que ahora normaliza a LF al leer — comprobado: las mismas fuentes en
      #     CRLF y en LF producen el MISMO `index.html`, byte a byte.
      #
      #     Aun asi se compara con `git diff` y no con un hash: es la
      #     comparacion correcta contra lo COMMITTEADO, y no depende de como
      #     tenga el worktree los finales de linea quien la ejecute.
      #
      #     Lo demas que sostiene la reproducibilidad, tambien medido: dos
      #     pasadas seguidas dan el mismo artefacto, y el unico recorrido de
      #     directorio que podria depender del orden del sistema de archivos
      #     (`validateAppFiles`, cuyo orden difiere entre NTFS y ext4) va con
      #     `.sort()` y ademas no emite nada al artefacto.
      - name: El index.html committeado es el build de las fuentes
        run: |
          node build-standalone.js
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html no esta al dia con las fuentes. Regeneralo con 'node build-standalone.js' y committealo (paso 3 del cierre de sesion en CLAUDE.md)."
            git diff --stat -- index.html
            exit 1
          fi
          echo "index.html coincide byte a byte con el build de las fuentes."

  # ==========================================================================
  # COMPORTAMIENTO (s154). Cubre el PRIMER hueco que el verify declara e
  # imprime en cada pasada: «no abre navegador, no monta la app, no pulsa
  # nada». Es el checklist de cierre de CLAUDE.md, ejecutado.
  #
  # POR QUE UN JOB APARTE Y NO PASOS DEL DE ARRIBA. La tesis de s153 sigue
  # intacta —este YAML INVOCA un comando que corre igual en local,
  # `npm run test:e2e`, y no reinterpreta nada—, pero las dos redes tienen
  # naturaleza y coste distintos: el `verify` son ~5 s sin dependencias y es el
  # paso 2 del cierre, mientras que esto descarga un Chromium de ~115 MB. Meter
  # los navegadores dentro de `npm run verify` convertiria en minutos el unico
  # comando del que depende «si falla, no se sigue». Separados, ademas, el rojo
  # dice cual de las dos fallo sin abrir el log.
  #
  # `needs: verify` NO es por orden estetico: la suite carga el `index.html`
  # COMMITTEADO, y es el job de arriba el que acaba de probar que ese artefacto
  # es el build de las fuentes. Sin esa garantia, un rojo aqui podria significar
  # «el comportamiento cambio» o «el artefacto esta viejo», que son dos cosas
  # muy distintas de arreglar.
  # ==========================================================================
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # CACHE DEL NAVEGADOR (s168) — Y SIN `apt` (s169), QUE ERA LA COLA DE VERDAD.
      #
      # ESTE COMENTARIO AFIRMABA ALGO FALSO Y SE CORRIGE CON EL LOG DELANTE. Decia
      # que la cache «compra quitar esa COLA» de 217 y 672 s. No la compra: la
      # cola no la producia la descarga de Chromium sino `apt`, y `apt` corria en
      # LOS DOS CAMINOS —con acierto de cache y sin el—, asi que cachear el
      # navegador no podia tocarla. De hecho la cola volvio a salir en el run con
      # FALLO de cache.
      #
      # MEDIDO leyendo los logs paso a paso de los 11 ultimos runs con job e2e
      # (`gh` esta instalado desde s161; s153 lo dio por ausente y la nota se
      # arrastro hasta s169):
      #
      #                            descarga Chromium   `apt` bajando fuentes   paso
      #   7 runs rapidos ........       ~10 s                0-6 s           21-28 s
      #   el run de 672 s .......       ~11 s           10 min 49 s          672 s
      #   el de 217 s (FALLO) ...        ~9 s            3 min 15 s          217 s
      #   acierto ...............      omitida           1 min 21 s           97 s
      #   acierto ...............      omitida              42 s             55 s
      #   acierto (v0.99.0) .....      omitida              ~14 s            14 s
      #
      # Dos hechos que cierran el diagnostico. (1) Los MISMOS 9 paquetes de
      # fuentes —CJK, cirilico, `xfonts-*`; 21,1 MB de descarga, 79,5 MB en
      # disco— se instalan en TODOS los runs, con cache y sin ella. (2) Todas las
      # librerias del NAVEGADOR dicen `already the newest version`: esas si estan
      # en la imagen de `ubuntu-latest`, y por eso `install-deps` no instala nada
      # util. Lo unico que hace es bajar fuentes.
      #
      # Y el paso no es CARO, es VARIABLE: 14 s en el run de v0.99.0 y 10 min 49 s
      # en el peor. Lo que se quita aqui no es un coste medio, es la VARIANZA — el
      # caso de 11 minutos que puede repetirse cualquier dia sin avisar.
      #
      # RIESGO ASUMIDO: el Chromium del CI se queda sin fuentes CJK ni cirilicas.
      # No lo nota nadie, porque la app sirve sus PROPIOS woff2 con `unicode-range`
      # latino y la suite no compara ni un pixel — no hay capturas de referencia.
      # Si aun asi Chromium no arrancara, el rojo es inmediato e inequivoco y se
      # revierte esta linea.
      #
      # La clave lleva `package-lock.json` porque de ahi sale la version de
      # Playwright: al subirla, el navegador cacheado ya no sirve y la clave
      # cambia sola.
      - name: Cache de Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Solo chromium: la suite declara ese unico proyecto en
      # playwright.config.js. SIN `--with-deps` a proposito (ver arriba): las
      # librerias del navegador ya estan en la imagen y lo unico que anadia era
      # la descarga de fuentes.
      - name: Instalar Chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # El servidor lo levanta y lo tumba la propia configuracion (`webServer`
      # -> `.claude/static-server.js`), asi que aqui no hay que orquestar nada.
      - name: npm run test:e2e
        run: npm run test:e2e

      # Diagnostico, no comprobacion: si algo se pone rojo, la traza dice donde
      # sin tener que reproducirlo a ciegas.
      - name: Guardar el informe si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
