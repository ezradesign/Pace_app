# RAMA DE DIAGNÓSTICO (no se junta): la F4 («yet to move») en Linux (= Android).
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mide:
    name: mide la F4 en Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache de Chromium y WebKit
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Medir
        run: npx playwright test tests/fondo-24nov.spec.js tests/textos-al-limite.spec.js tests/ritmo-series.spec.js tests/ritmo-ayer.spec.js tests/pausa-sin-repetir.spec.js tests/home-sin-scroll.spec.js --project=chromium --reporter=list
