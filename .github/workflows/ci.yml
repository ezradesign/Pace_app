# RAMA DE DIAGNÓSTICO (no se junta): mide en Linux cuánto le sobra a cada texto
# (tests/textos-al-limite.mide.js), para compararlo con lo medido en Windows.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  textos:
    name: textos (${{ matrix.trozo }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        trozo: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache de Chromium y WebKit
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Medir
        run: npx playwright test -c playwright.mide.config.js --shard=${{ matrix.trozo }}/4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textos-linux-${{ matrix.trozo }}
          path: test-results/textos-al-limite/
          retention-days: 7
  prueba:
    name: prueba de los textos acortados
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache de Chromium y WebKit
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - run: npx playwright test tests/textos-al-limite.spec.js --project=chromium
