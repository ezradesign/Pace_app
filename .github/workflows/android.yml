# PACE · la app de Android
#
# Compila un APK de prueba (debug) en GitHub, para que nadie tenga que instalar
# Android Studio. Usa el `index.html` committeado, que el workflow CI ya
# comprueba que esta al dia con las fuentes, y lo empaqueta con Capacitor.
# El APK queda como artefacto de la ejecucion (pestaña Actions de GitHub).
#
# Si el repo tiene la llave de subida a Google Play en sus secretos
# (PACE_UPLOAD_KEYSTORE, el archivo en base64, y PACE_UPLOAD_PASSWORD), compila
# tambien el AAB firmado que se sube a Play: artefacto `pace-play-vX.Y.Z`, con
# `PACE-X.Y.Z.aab` dentro. Sin la llave ese paso se salta y todo lo demas sigue
# igual.
#
# En `main`, cada version deja ademas su AAB en un BORRADOR de release de GitHub
# (`vX.Y.Z`): los artefactos caducan a los 90 dias y Play no deja volver a subir
# un numero de version, asi que el archivo que se subio tiene que poder
# encontrarse siempre. Es borrador porque el repo es publico: un borrador solo
# lo ven quienes pueden escribir en el repo. Si llegan varios commits con la
# misma version, el borrador se queda con el AAB del ultimo.

name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

# write: para dejar el AAB de cada version en su borrador de release.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAY_LLAVE: ${{ secrets.PACE_UPLOAD_KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Prepara `www/` con lo que va dentro del APK y lo copia al proyecto Android.
      - run: npm run android:sync

      # En Windows git no guarda el bit de ejecucion: se pone aqui por si acaso.
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: pace-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # La version para Google Play. La llave solo existe en el disco del
      # runner mientras dura este paso y se borra al acabar.
      - name: aab firmado para Google Play
        id: aab
        env:
          LLAVE: ${{ secrets.PACE_UPLOAD_KEYSTORE }}
          PACE_UPLOAD_PASSWORD: ${{ secrets.PACE_UPLOAD_PASSWORD }}
        if: env.HAY_LLAVE == 'true'
        working-directory: android
        run: |
          export PACE_UPLOAD_KEYSTORE="$RUNNER_TEMP/pace-upload.jks"
          trap 'rm -f "$PACE_UPLOAD_KEYSTORE"' EXIT
          echo "$LLAVE" | base64 --decode > "$PACE_UPLOAD_KEYSTORE"
          ./gradlew bundleRelease --no-daemon
          # La misma version que lee build.gradle, para el nombre del archivo.
          VERSION=$(sed -n "s/.*PACE_VERSION = 'v\([0-9.]*\)'.*/\1/p" ../app/state-core.jsx | head -1)
          test -n "$VERSION"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/PACE-$VERSION.aab"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.aab.outcome == 'success'
        with:
          name: pace-play-v${{ steps.aab.outputs.version }}
          path: ${{ runner.temp }}/PACE-${{ steps.aab.outputs.version }}.aab
          if-no-files-found: error

      # El borrador de release de la version, con su AAB y su linea del
      # CHANGELOG. Solo desde main: una rama no debe pisar el archivo de una
      # version que quiza ya se subio a Play.
      - name: guardar el aab en el borrador de la version
        if: steps.aab.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.aab.outputs.version }}
        run: |
          TAG="v$VERSION"
          AAB="$RUNNER_TEMP/PACE-$VERSION.aab"
          NOTAS=$(grep -F "| $TAG |" CHANGELOG.md | head -1 | awk -F' \\| ' '{print $3}' | sed 's/ |$//')
          [ -n "$NOTAS" ] || NOTAS="Sin linea en el CHANGELOG."
          CUERPO=$(printf '%s\n\nCommit: %s\n\nBorrador: no se publica. Guarda el archivo que se sube a Google Play.' "$NOTAS" "$GITHUB_SHA")
          # Los borradores no tienen etiqueta todavia, asi que se buscan en la lista.
          if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            gh release upload "$TAG" "$AAB" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes "$CUERPO"
          else
            gh release create "$TAG" "$AAB" --draft --target "$GITHUB_SHA" --title "PACE $VERSION" --notes "$CUERPO"
          fi
