<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El lunes · tu semana</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E5A3A}a:hover{color:#2A3E27}
.cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6F695B}
.it{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;flex:1}
.col b{width:16px;border-radius:4px 4px 2px 2px;background:#9DAE97;display:block}
.cambio{display:grid;grid-template-columns:12px minmax(0,1fr);gap:9px;align-items:baseline;font-size:13.5px;line-height:1.45;color:#4A453C}
.cambio i{width:8px;height:8px;border-radius:50%;border:1.5px solid;box-sizing:border-box;display:block;transform:translateY(-1px)}
</style>
</helmet>
<div style="width:360px;height:718px;position:relative;overflow:hidden;background:#F2EDE0;color:#1F1C17;font-family:'Inter Tight',system-ui,sans-serif;font-size:13px">

  <div style="height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:#4A453C">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 5h14M2 9h10M2 13h14"></path></svg>
    <div style="display:flex;gap:24px">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 16h14M3 13l4-5 3 3 5-7"></path></svg>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="9" cy="7" r="4.5"></circle><path d="M6.5 11l-1 5 3.5-2 3.5 2-1-5"></path></svg>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="9" cy="9" r="2.5"></circle><path d="M9 1.5v2.5M9 14v2.5M1.5 9H4M14 9h2.5M3.7 3.7l1.8 1.8M12.5 12.5l1.8 1.8M3.7 14.3l1.8-1.8M12.5 5.5l1.8-1.8"></path></svg>
    </div>
  </div>

  <div style="position:absolute;left:50%;top:60px;transform:translateX(-50%);width:230px;height:230px;border-radius:50%;border:2px solid #D9D1BC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <span class="cap" style="font-size:11px">Bloque 1 de 10</span>
    <span class="it" style="font-size:52px;line-height:1">45:00</span>
  </div>

  <div style="position:absolute;left:12px;right:12px;bottom:12px;background:#F6F1E6;border:1px solid #D6CDB6;border-radius:14px;padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="cap">Lunes · tu semana</span>
      <span style="font-size:12px;color:#6F695B">del 28 sep al 4 oct</span>
    </div>

    <div style="display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;align-items:end">
      <div>
        <div class="cap" style="margin-bottom:4px">Te ayudó</div>
        <div class="it" style="font-size:21px;line-height:1.15">Cuello y Coherente 6·6</div>
        <div style="font-size:12px;color:#6F695B;margin-top:4px">31 de 40 pausas hechas</div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:5px;height:62px">
        <div class="col"><b style="height:40px"></b><span class="cap" style="font-size:9px">L</span></div>
        <div class="col"><b style="height:46px"></b><span class="cap" style="font-size:9px">M</span></div>
        <div class="col"><b style="height:20px"></b><span class="cap" style="font-size:9px">X</span></div>
        <div class="col"><b style="height:34px"></b><span class="cap" style="font-size:9px">J</span></div>
        <div class="col"><b style="height:18px"></b><span class="cap" style="font-size:9px">V</span></div>
      </div>
    </div>

    <div style="border-top:1px solid #E1D9C5;padding-top:12px;display:flex;flex-direction:column;gap:7px">
      <div class="cap">Esta semana</div>
      <div class="cambio"><i style="border-color:#6B7A8F"></i><span><span class="it" style="font-size:16px;color:#1F1C17">Cuello</span> vuelve el martes y el jueves.</span></div>
      <div class="cambio"><i style="border-color:#9A7B4F"></i><span>La pausa de las 16:35, que solías saltar, pasa a ser más corta.</span></div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center">
      <a href="#" class="it" style="font-size:15px">Dejarla como estaba</a>
      <button style="min-height:44px;display:flex;align-items:center;border:0;background:none;padding:0">
        <span class="it" style="background:#EAE4D4;border:1px solid rgba(62,90,58,.35);border-radius:17px;height:34px;display:flex;align-items:center;padding:0 18px;color:#3E5A3A;font-size:19px">Vale →</span>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":718}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
