<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cada mañana · escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E5A3A}a:hover{color:#2A3E27}
.cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6F695B}
.it{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500}
.op{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid #C9C0A8;border-radius:12px;background:none;font:inherit;color:#1F1C17;text-align:left;min-width:0}
.hora{border-bottom:1px dotted #8A8372}
</style>
</helmet>
<div style="width:960px;height:250px;box-sizing:border-box;background:#F6F1E6;border:1px solid #D6CDB6;border-radius:16px;padding:18px 22px 20px;color:#1F1C17;font-family:'Inter Tight',system-ui,sans-serif;font-size:13px;display:flex;flex-direction:column;gap:14px">

  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span class="cap">A tu ritmo · martes</span>
      <span class="it" style="font-size:24px;line-height:1.1">Hoy, como cada martes</span>
      <span class="it" style="font-size:15px;color:#6F695B">Empiezas a las <span class="hora">9:00</span>, comes a las <span class="hora">14:00</span> durante <span class="hora">1 h</span> y terminas a las <span class="hora">18:00</span>.</span>
    </div>
    <button style="border:1px solid #3E5A3A;border-radius:16px;background:none;color:#3E5A3A;font-family:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px">Hoy voy por libre</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:stretch">
    <button class="op"><span class="it" style="font-size:17px">Una hora</span><span class="it" style="font-size:13px;color:#6F695B">Hasta las 10:00</span></button>
    <button class="op"><span class="it" style="font-size:17px">Dos horas</span><span class="it" style="font-size:13px;color:#6F695B">Hasta las 11:00</span></button>
    <button class="op"><span class="it" style="font-size:17px">Media jornada</span><span class="it" style="font-size:13px;color:#6F695B">De 9:00 a 13:00</span></button>
    <button class="op" style="border:1.5px solid #3E5A3A;background:#EAE4D4"><span style="display:flex;justify-content:space-between;align-items:baseline"><span class="it" style="font-size:17px">Jornada entera</span><span class="cap" style="font-size:9px;color:#3E5A3A">tu martes</span></span><span class="it" style="font-size:13px;color:#6F695B">De 9:00 a 18:00</span></button>
    <button style="min-height:44px;display:flex;align-items:center;border:0;background:none;padding:0 0 0 6px">
      <span class="it" style="background:#EAE4D4;border:1px solid rgba(62,90,58,.35);border-radius:17px;height:34px;display:flex;align-items:center;padding:0 18px;color:#3E5A3A;font-size:19px;white-space:nowrap">Comienza →</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":250}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
