<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Calendario · PACE</title>
<!-- La vuelta del permiso de Google y de Microsoft (app/ritmo/ritmo.calendario.web.js).
     Deja lo que trae la direccion en localStorage, que la pestaña de PACE escucha,
     y se cierra. No usa window.opener: la pagina del proveedor puede haber roto
     ese hilo. Autocontenida y sin peticiones, como privacy.html. -->
<style>
  :root { --paper: #F2EDE0; --ink: #1F1C17; --ink-2: #4A453C; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1d1a14; --ink: #EDE5D3; --ink-2: #c0b49e; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  p { max-width: 32ch; text-align: center; color: var(--ink-2); font-size: 15px; line-height: 1.6; }
  b { font-family: Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; color: var(--ink); display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<p><b>Listo</b>Ya puedes cerrar esta ventana y volver a PACE.</p>
<script>
  (function () {
    var datos = (location.hash || '').replace(/^#/, '') || (location.search || '').replace(/^\?/, '');
    try { localStorage.setItem('pace.calendario.vuelta', JSON.stringify({ datos: datos, t: Date.now() })); } catch (e) {}
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    setTimeout(function () { try { window.close(); } catch (e) {} }, 300);
  })();
</script>
</body>
</html>
